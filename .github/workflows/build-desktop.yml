name: Собрать НеЗабудка .exe

on:
  # Запускается вручную из вкладки Actions на GitHub
  workflow_dispatch:
  # Автоматически при каждом push в main
  push:
    branches: [main]
    paths:
      - 'artifacts/desktop/**'
      - 'artifacts/smart-notes/**'
      - 'lib/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    name: Сборка Windows .exe
    runs-on: windows-latest

    steps:
      # 1. Скачать код репозитория
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Установить Node.js 20
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Установить pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      # 4. Кэшировать node_modules для скорости
      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      # 5. Установить все зависимости
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      # 6. Собрать фронтенд + упаковать в Electron
      - name: Build desktop app
        run: pnpm --filter @workspace/desktop make:win
        env:
          # Отключает открытие браузера при сборке Vite
          BROWSER: none
          # Нужно electron-builder для подписи (без этого собирает без подписи)
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # 7. Загрузить готовый установщик как артефакт Actions
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: НеЗабудка-Windows
          path: |
            artifacts/desktop/release/*.exe
            artifacts/desktop/release/*.zip
          retention-days: 30
          if-no-files-found: error
