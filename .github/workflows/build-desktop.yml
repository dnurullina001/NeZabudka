name: Собрать НеЗабудка .exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/desktop/**'
      - 'artifacts/smart-notes/**'
      - 'lib/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    name: Сборка Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Установить native пакеты через npm напрямую
        shell: pwsh
        run: |
          # Устанавливаем через npm (он не смотрит на pnpm overrides)
          npm install --no-save `
            @rollup/rollup-win32-x64-msvc@4.62.2 `
            lightningcss-win32-x64-msvc@1.32.0 `
            @tailwindcss/oxide-win32-x64-msvc@4.3.3

      - name: Копируем пакеты в pnpm node_modules
        shell: pwsh
        run: |
          $base = "D:\a\NeZabudka\NeZabudka\node_modules\.pnpm"

          # === ROLLUP ===
          $rollupSrc = "node_modules\@rollup\rollup-win32-x64-msvc"
          $rollupDst = "$base\rollup@4.62.2\node_modules\@rollup\rollup-win32-x64-msvc"
          if (Test-Path $rollupSrc) {
            New-Item -ItemType Directory -Force -Path "$base\rollup@4.62.2\node_modules\@rollup" | Out-Null
            Copy-Item -Recurse -Force $rollupSrc $rollupDst
            Write-Host "✅ rollup скопирован"
          } else {
            Write-Host "❌ rollup source не найден"
          }

          # === LIGHTNINGCSS ===
          $lightSrc = "node_modules\lightningcss-win32-x64-msvc"
          $lightDst = "$base\lightningcss@1.32.0\node_modules\lightningcss-win32-x64-msvc"
          if (Test-Path $lightSrc) {
            New-Item -ItemType Directory -Force -Path "$base\lightningcss@1.32.0\node_modules" | Out-Null
            Copy-Item -Recurse -Force $lightSrc $lightDst
            Write-Host "✅ lightningcss скопирован"
          } else {
            Write-Host "❌ lightningcss source не найден"
          }

          # === TAILWIND OXIDE ===
          $oxideSrc = "node_modules\@tailwindcss\oxide-win32-x64-msvc"
          $oxideDst = "$base\@tailwindcss+oxide@4.3.3\node_modules\@tailwindcss\oxide-win32-x64-msvc"
          if (Test-Path $oxideSrc) {
            New-Item -ItemType Directory -Force -Path "$base\@tailwindcss+oxide@4.3.3\node_modules\@tailwindcss" | Out-Null
            Copy-Item -Recurse -Force $oxideSrc $oxideDst
            Write-Host "✅ tailwind oxide скопирован"
          } else {
            Write-Host "❌ tailwind oxide source не найден"
          }

      - name: Проверка что пакеты на месте
        shell: pwsh
        run: |
          $base = "D:\a\NeZabudka\NeZabudka\node_modules\.pnpm"
          
          $rollup = "$base\rollup@4.62.2\node_modules\@rollup\rollup-win32-x64-msvc"
          $light = "$base\lightningcss@1.32.0\node_modules\lightningcss-win32-x64-msvc"
          $oxide = "$base\@tailwindcss+oxide@4.3.3\node_modules\@tailwindcss\oxide-win32-x64-msvc"
          
          if (Test-Path $rollup) { Write-Host "✅ rollup OK" } else { Write-Host "❌ rollup НЕТ" }
          if (Test-Path $light) { Write-Host "✅ lightningcss OK" } else { Write-Host "❌ lightningcss НЕТ" }
          if (Test-Path $oxide) { Write-Host "✅ tailwind oxide OK" } else { Write-Host "❌ tailwind oxide НЕТ" }

      - name: Build desktop app
        run: pnpm --filter @workspace/desktop make:win
        env:
          BROWSER: none
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: НеЗабудка-Windows
          path: |
            artifacts/desktop/release/*.exe
            artifacts/desktop/release/*.zip
            artifacts/desktop/dist/*.exe
            artifacts/desktop/dist/*.zip
          retention-days: 30
          if-no-files-found: warn
