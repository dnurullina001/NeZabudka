name: Собрать НеЗабудка .exe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/desktop/**'
      - 'artifacts/smart-notes/**'
      - 'lib/**'
      - '.github/workflows/build-desktop.yml'
jobs:
  build-windows:
    name: Сборка Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Создать иконку из маскота
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/desktop/assets
          magick artifacts/smart-notes/src/assets/nezabudka-mascot.png `
            -define icon:auto-resize=256,128,64,48,32,16 `
            artifacts/desktop/assets/icon.ico
          Write-Host "Иконка создана"

      - name: Build desktop app
        run: pnpm --filter @workspace/desktop make:win
        env:
          BROWSER: none
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: НеЗабудка-Windows
          path: |
            artifacts/desktop/release/*.exe
            artifacts/desktop/release/*.zip
          retention-days: 30
          if-no-files-found: warn

      - name: Удалить старые ассеты релиза latest
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $assets = gh release view latest --json assets --jq '.assets[].name' 2>$null
            if ($assets) {
              foreach ($asset in $assets) {
                gh release delete-asset latest "$asset" --yes
                Write-Host "Удалён: $asset"
              }
            } else {
              Write-Host "Релиз latest есть, но ассетов нет"
            }
          } else {
            Write-Host "Релиза latest ещё не существует — пропускаем"
          }

      - name: Создать или обновить релиз latest и загрузить файлы
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: НеЗабудка — последняя версия
          body: |
            Автоматическая сборка из ветки `main`.

            **Как установить:**
            1. Скачайте `.exe`-установщик ниже
            2. Запустите и следуйте инструкциям
          prerelease: false
          make_latest: true
          files: |
            artifacts/desktop/release/*.exe
            artifacts/desktop/release/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
