name: Собрать НеЗабудка .exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/desktop/**'
      - 'artifacts/smart-notes/**'
      - 'lib/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    name: Сборка Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Fix native пакеты для Windows
        run: |
          pnpm add -w @rollup/rollup-win32-x64-msvc@4.62.2
          pnpm add -w lightningcss-win32-x64-msvc@1.32.0

      - name: Build desktop app
        run: pnpm --filter @workspace/desktop make:win
        env:
          BROWSER: none
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: НеЗабудка-Windows
          path: |
            artifacts/desktop/release/*.exe
            artifacts/desktop/release/*.zip
          retention-days: 30
          if-no-files-found: warn
