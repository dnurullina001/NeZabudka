name: Собрать НеЗабудка .exe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'artifacts/desktop/**'
      - 'artifacts/smart-notes/**'
      - 'lib/**'
      - '.github/workflows/build-desktop.yml'

jobs:
  build-windows:
    name: Сборка Windows .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Диагностика - ищем rollup пакет
        shell: pwsh
        run: |
          Write-Host "=== Ищем rollup win32 пакет ==="
          $path = "D:\a\NeZabudka\NeZabudka\node_modules\.pnpm"
          
          Get-ChildItem -Path $path -Filter "*rollup*" -Recurse -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -like "*win32*" } |
            Select-Object FullName |
            Format-List
          
          Write-Host "=== Содержимое rollup папки ==="
          $rollupPath = "$path\rollup@4.62.2\node_modules\@rollup"
          if (Test-Path $rollupPath) {
            Get-ChildItem $rollupPath | Select-Object Name
          } else {
            Write-Host "Папка не найдена: $rollupPath"
          }
          
          Write-Host "=== Проверяем overrides в lockfile ==="
          $lock = Get-Content "D:\a\NeZabudka\NeZabudka\pnpm-lock.yaml" | 
            Select-String "win32"
          if ($lock) {
            Write-Host "НАЙДЕНЫ win32 строки в lockfile:"
            $lock
          } else {
            Write-Host "win32 строк в lockfile НЕТ - это хорошо"
          }

      - name: Build desktop app
        run: pnpm --filter @workspace/desktop make:win
        env:
          BROWSER: none
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: НеЗабудка-Windows
          path: |
            artifacts/desktop/release/*.exe
            artifacts/desktop/release/*.zip
            artifacts/desktop/dist/*.exe
            artifacts/desktop/dist/*.zip
          retention-days: 30
          if-no-files-found: warn
