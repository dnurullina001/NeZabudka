kind = "web"
previewPath = "/"
title = "Умные заметки"
version = "1.0.0"
id = "artifacts/smart-notes"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21118

[services.development]
run = "pnpm --filter @workspace/smart-notes run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/smart-notes", "run", "build" ]
serve = "static"
publicDir = "artifacts/smart-notes/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21118"
BASE_PATH = "/"
